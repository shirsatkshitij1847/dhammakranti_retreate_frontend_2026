            - paragraph [ref=e194]: ध्यानसाधना, धम्मअभ्यास, आध्यात्मिक मैत्री, सामूहिक जीवन आणि सामाजिक कार्य यांच्या माध्यमातून व्यक्तीच्या वैयक्तिक तसेच सामाजिक परिवर्तनासाठी ही चळवळ कार्य करते.
            - paragraph [ref=e195]: भारतात ही चळवळ त्रैलोक्य बौद्ध महासंघ सहाय्यक गण (TBMSG) या नावानेही ओळखली जात होती. भारतात तिच्या कार्याच्या विस्तारात धम्मचारी लोकमित्र आणि अनेक धम्ममित्रांचे योगदान महत्त्वाचे राहिले आहे.
            - paragraph [ref=e196]: आज त्रिरत्नचा प्रवास विविध देशांतील धम्मकेंद्रे, ध्यानकेंद्रे आणि स्थानिक समुदायांमधून सुरू आहे.
            - heading [level=2] [ref=e197]: 💙 बाबासाहेबांच्या धम्मक्रांतीची प्रेरणा
            - paragraph [ref=e198]: १४ ऑक्टोबर १९५६ रोजी डॉ. बाबासाहेब आंबेडकरांनी लाखो अनुयायांसह बुद्धांच्या धम्माची दीक्षा घेतली आणि भारतीय समाजाला स्वातंत्र्य, समता, बंधुता व न्यायाचा नवा मार्ग दाखवला.
            - paragraph [ref=e199]: बाबासाहेबांचे स्वप्न केवळ सामाजिक विषमता दूर करण्याचे नव्हते, तर प्रत्येक व्यक्तीला स्वाभिमानाने, विवेकाने आणि सन्मानाने जगता यावे, असे समाजजीवन घडवण्याचे होते.
            - paragraph [ref=e200]: त्यांच्या विचारांतून आपल्याला प्रज्ञा, शील आणि करुणेचे महत्त्व समजते.
            - paragraph [ref=e201]: त्रिरत्न बौद्ध महासंघाच्या भारतीय कार्याला बाबासाहेबांच्या धम्मक्रांतीची प्रेरणा लाभली आहे. सामाजिक परिवर्तनासोबतच व्यक्तीचे अंतर्मन समृद्ध करण्याचा प्रयत्न या कार्यातून केला जातो.
