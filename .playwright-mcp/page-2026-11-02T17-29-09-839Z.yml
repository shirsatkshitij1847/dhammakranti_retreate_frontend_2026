              - text: यांचा मैत्रीपूर्ण परिवर्तनाचा प्रवास.
            - heading "🌏 त्रिरत्न चळवळ म्हणजे नेमकं काय?" [level=2] [ref=e119]
            - paragraph [ref=e120]:
              - text: त्रिरत्न म्हणजे तीन रत्ने —
              - strong [ref=e121]: बुद्ध, धम्म आणि संघ.
            - paragraph [ref=e122]: त्रिरत्न बौद्ध समुदाय ही जगभर कार्यरत असलेली आधुनिक बौद्ध चळवळ आहे. पूज्य उर्गेन संघरक्षित (Urgyen Sangharakshita) यांनी १९६७ मध्ये इंग्लंडमध्ये या चळवळीची सुरुवात केली. सुरुवातीला ती Friends of the Western Buddhist Order (FWBO) या नावाने ओळखली जात होती. २०१० मध्ये तिचे नाव Triratna Buddhist Community असे करण्यात आले.
            - paragraph [ref=e123]: या चळवळीचा मुख्य उद्देश म्हणजे बुद्धांचा प्राचीन धम्म आधुनिक जीवनाशी जोडणे आणि तो प्रत्येकासाठी अनुभवण्याजोगा बनवणे.
            - paragraph [ref=e124]: ध्यानसाधना, धम्मअभ्यास, आध्यात्मिक मैत्री, सामूहिक जीवन आणि सामाजिक कार्य यांच्या माध्यमातून व्यक्तीच्या वैयक्तिक तसेच सामाजिक परिवर्तनासाठी ही चळवळ कार्य करते.
            - paragraph [ref=e125]: भारतात ही चळवळ त्रैलोक्य बौद्ध महासंघ सहाय्यक गण (TBMSG) या नावानेही ओळखली जात होती. भारतात तिच्या कार्याच्या विस्तारात धम्मचारी लोकमित्र आणि अनेक धम्ममित्रांचे योगदान महत्त्वाचे राहिले आहे.
            - paragraph [ref=e126]: आज त्रिरत्नचा प्रवास विविध देशांतील धम्मकेंद्रे, ध्यानकेंद्रे आणि स्थानिक समुदायांमधून सुरू आहे.
            - heading "💙 बाबासाहेबांच्या धम्मक्रांतीची प्रेरणा" [level=2] [ref=e127]
            - paragraph [ref=e128]: १४ ऑक्टोबर १९५६ रोजी डॉ. बाबासाहेब आंबेडकरांनी लाखो अनुयायांसह बुद्धांच्या धम्माची दीक्षा घेतली आणि भारतीय समाजाला स्वातंत्र्य, समता, बंधुता व न्यायाचा नवा मार्ग दाखवला.
            - paragraph [ref=e129]: बाबासाहेबांचे स्वप्न केवळ सामाजिक विषमता दूर करण्याचे नव्हते, तर प्रत्येक व्यक्तीला स्वाभिमानाने, विवेकाने आणि सन्मानाने जगता यावे, असे समाजजीवन घडवण्याचे होते.
            - paragraph [ref=e130]: त्यांच्या विचारांतून आपल्याला प्रज्ञा, शील आणि करुणेचे महत्त्व समजते.
            - paragraph [ref=e131]: त्रिरत्न बौद्ध महासंघाच्या भारतीय कार्याला बाबासाहेबांच्या धम्मक्रांतीची प्रेरणा लाभली आहे. सामाजिक परिवर्तनासोबतच व्यक्तीचे अंतर्मन समृद्ध करण्याचा प्रयत्न या कार्यातून केला जातो.
            - blockquote [ref=e132]: बाबासाहेबांनी दाखवलेला प्रबुद्ध समाजाचा मार्ग आणि बुद्धांनी दिलेला अंतर्मन परिवर्तनाचा धम्म — या दोन्ही प्रेरणांना आपल्या जीवनात जोडणे, हाच आमच्या प्रवासाचा आधार आहे.
            - heading "🌼 त्रिरत्न अकोला काय करते?" [level=2] [ref=e133]
            - paragraph [ref=e134]: आम्ही केवळ कार्यक्रम आयोजित करण्यापुरते मर्यादित राहू इच्छित नाही. तर माणसांना जोडणारा, एकमेकांना समजून घेणारा आणि एकत्र शिकण्याची संधी देणारा समुदाय निर्माण करण्याचा प्रयत्न करतो.
            - paragraph [ref=e135]: "आमच्या प्रमुख उपक्रमांमध्ये समावेश आहे:"
            - list [ref=e136]:
              - listitem [ref=e137]:
                - strong [ref=e138]: "ध्यानसाधना:"
                - text: स्वतःच्या मनाला समजून घेण्यासाठी आणि मानसिक शांततेचा अनुभव घेण्यासाठी.
              - listitem [ref=e139]:
                - strong [ref=e140]: "धम्म प्रशिक्षण:"
                - text: बुद्धांच्या शिकवणीचा अभ्यास करून ती दैनंदिन जीवनात उतरवण्यासाठी.
              - listitem [ref=e141]:
                - strong [ref=e142]: "मैत्री भावना:"
                - text: एकमेकांशी प्रेम, आपलेपणा आणि सकारात्मक संबंध निर्माण करण्यासाठी.
              - listitem [ref=e143]:
                - strong [ref=e144]: "युवक विकास:"
                - text: युवकांना आत्मविश्वास, विवेक आणि सकारात्मक जीवनदृष्टी मिळण्यासाठी.
              - listitem [ref=e145]:
                - strong [ref=e146]: "धम्मशिबिरे व रिट्रीट:"
                - text: काही काळ दैनंदिन धावपळीतून थांबून स्वतःला जाणून घेण्यासाठी.
              - listitem [ref=e147]:
                - strong [ref=e148]: "सामाजिक उपक्रम:"
                - text: समता, करुणा आणि सामाजिक एकात्मतेची भावना वाढवण्यासाठी.
            - heading "🌳 आमचा विश्वास – प्रत्येकामध्ये बुद्धत्वाचे बीज आहे!" [level=2] [ref=e149]
            - paragraph [ref=e150]: आम्हाला वाटते की, माणसाला बदलण्यासाठी नेहमीच मोठ्या गोष्टींची गरज नसते.
            - paragraph [ref=e151]: कधी एखादी मैत्रीपूर्ण भेट, कधी मनापासून ऐकून घेणारी व्यक्ती, कधी ध्यानातील काही शांत क्षण, तर कधी धम्मातील एखादा विचारसुद्धा आयुष्याकडे पाहण्याचा दृष्टिकोन बदलू शकतो.
            - paragraph [ref=e152]: आम्ही परिपूर्ण माणसे घडवण्याचा दावा करत नाही. आम्ही स्वतःही शिकत आहोत, अनुभव घेत आहोत आणि एकमेकांच्या साथीने पुढे जात आहोत.
            - paragraph [ref=e153]: आमचा प्रयत्न एवढाच आहे की प्रत्येकाला स्वतःमधील बुद्धबीज ओळखण्यासाठी एक सुंदर वातावरण मिळावे.
