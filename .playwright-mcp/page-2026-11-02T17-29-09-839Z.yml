            - paragraph [ref=e113]: कधी विचार केलाय का… प्रत्येक माणसाच्या अंतरंगात एक सुंदर, निर्मळ आणि करुणामय व्यक्तिमत्त्व दडलेलं असतं. पण आयुष्याच्या धावपळीत, परिस्थितीच्या ओझ्याखाली आणि विचारांच्या गुंत्यात आपण स्वतःमधील त्या सुंदर स्वभावाला विसरून जातो.
